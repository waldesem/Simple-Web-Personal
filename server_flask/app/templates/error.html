<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Кадровая безопасность — Ошибка</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        color: #333;
      }

      .error-card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 40px;
        max-width: 500px;
        width: 100%;
        text-align: center;
      }

      h1 {
        color: #dc3545;
        font-size: 2.2rem;
        margin: 0 0 12px 0;
        font-weight: 700;
      }

      h2 {
        color: #555;
        font-size: 1.3rem;
        margin: 0 0 20px 0;
        font-weight: 600;
      }

      p {
        color: #666;
        line-height: 1.6;
        margin: 0 0 30px 0;
        font-size: 1rem;
      }

      a {
        display: inline-block;
        background-color: #0d6efd;
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        transition:
          background-color 0.2s ease,
          transform 0.1s ease;
      }

      a:hover {
        background-color: #0b5ed7;
        transform: translateY(-1px);
      }

      a:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <h1>Oops! Error {{ error.code }}</h1>
      <h2>{{ error.name }}</h2>
      <p>{{ error.description }}</p>
      <a href="/">Вернуться на главную</a>
    </div>
  </body>
</html>
